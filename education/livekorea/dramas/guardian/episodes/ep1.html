/* ================================================================

   ----------------------------------------------------------------
   Each expression has:

     meaning_ko   : Korean explanation (한국어 설명)

   ----------------------------------------------------------------
   30 slots total. Empty slots show as "Coming Soon" automatically.

var EP_DATA = {
  available: true,
  titleEn: 'Guardian: The Lonely and Great God \u2014 Episode 1',
  titleKo: '\uc4f8\uc4f8\ud558\uace0 \ucc2c\ub780\ud558\u795e \u2013 \ub3c4\uae68\ube44 1\ud654',
  expressions: [
    {
      korean: '\uae30\ub2e4\ub824\ub77c',
      romanization: 'Gidaryeora',
      english: 'Wait / Stand by',
      partOfSpeech: 'expression',
      scene: 'Script p.5 \u2014 S#7. Palace gate. Kim Shin is ordered to remove his armour. He calmly tells his men to wait as he steps forward alone. One word, issued with total authority. His men freeze.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 5\ud398\uc774\uc9c0 \u2014 S#7. \uad81\uad90 \uc55e. \uad70\uc7a5\uc744 \ud480\ub77c\ub294 \uba85\ub839\uc744 \ubc1b\uc740 \uae40\uc2e0\uc774 \ubd80\ud558\ub4e4\uc5d0\uac8c \ud55c \ub9c8\ub514\ub85c \uc9c0\uc2dc\ud569\ub2c8\ub2e4. \ub2e8\ud638\ud558\uace0 \uc6c4\uc5c4\ud55c \uba85\ub839\uc785\ub2c8\ub2e4.',
      meaning: 'Casual imperative of \uae30\ub2e4\ub9ac\ub2e4 (to wait). Plain speech \u2014 used with those equal or younger, or when giving a commanding order. Kim Shin uses plain speech throughout: it marks his age and authority. Polite: \uae30\ub2e4\ub824\uc694. Formal polite: \uae30\ub2e4\ub824 \uc8fc\uc138\uc694.',
      meaning_ko: '\uae30\ub2e4\ub9ac\ub2e4\uc758 \ubc18\ub9d0 \uba85\ub839\ud615\uc785\ub2c8\ub2e4. \uae40\uc2e0\uc740 \ub4dc\ub77c\ub9c8 \ub0b4\ub0b4 \ubc18\ub9d0\uccb4\ub97c \uc4d1\ub2c8\ub2e4. \uc774\ub294 \uadf8\uc758 \uc5f0\ub839\uacfc \uad8c\uc704\ub97c \ub4dc\ub7ec\ub0b4\ub294 \ud45c\ud604\uc785\ub2c8\ub2e4. \uacf5\uc190\ud55c \ud45c\ud604: \uae30\ub2e4\ub824\uc694. \uacf5\uc2dd \uacf5\uc190: \uae30\ub2e4\ub824 \uc8fc\uc138\uc694.',
      example: 'A: "I\u0027m leaving." B: "\uae30\ub2e4\ub824\ub77c. \ud560 \ub9d0\uc774 \ub354 \uc788\ub2e4."',
      example_ko: 'A: "\uc774\uc81c \uac00\uc694." B: "\uae30\ub2e4\ub824\ub77c. \ud560 \ub9d0\uc774 \ub354 \uc788\ub2e4."',
      youtubeUrl: ''
    },
    {
      korean: '\uac00\uc138\uc694 \uc7a5\uad70. \uc800\ub294, \uad1c\uc77c\uc2b5\ub2c8\ub2e4..',
      romanization: 'Gaseyo Janggun. Jeoneun, gwaenchanseumnida..',
      english: 'Go, General. I am\u2026 fine.',
      partOfSpeech: 'expression',
      scene: 'Script p.7 \u2014 S#7. The Queen is held at swordpoint. Kim Shin rushes toward her. She meets his eyes with perfect composure and says this \u2014 telling him not to stop for her. She will die with grace.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 7\ud398\uc774\uc9c0 \u2014 S#7. \uce7c\ub0a0\uc744 \uc55e\uc5d0 \ub454 \uc655\ube44\uac00 \ub2ec\ub824\uc624\ub294 \uae40\uc2e0\uc744 \ubc14\ub77c\ubcf4\uba70 \ub9d0\ud569\ub2c8\ub2e4. \uc790\uc2e0\uc744 \uc704\ud574 \uba48\uc6b0\uc9c0 \ub9d0\ub77c\ub294 \ub73b, \ud488\uaca9\ucfbc\ud55c \uc791\ubcc4\uc785\ub2c8\ub2e4.',
      meaning: '\uacf5\uc2dd \uae40\uc2e0\uccb4\uc5d0\uc11c \uc2e4\uc81c \ub300\uc0ac\ub85c, \uac00\uc138\uc694 + \uc800\ub294 \uad1c\uc77c\uc2b5\ub2c8\ub2e4. \u2018\uc800\ub294 \uad1c\uc77c\uc2b5\ub2c8\ub2e4\u2019\ub294 \uad1c\ucc2e\ub2e4\uc758 \uac00\uc7a5 \uc885\ub958 \uacf5\uc2dd\uccb4\ub85c, \uc5b4\ub978\uc774\ub098 \ubaa8\ub974\ub294 \ubd84\ud55c\ud14c \uc4c1\ub2c8\ub2e4. \ub531\ub5a8\ub9ac\ub294 \ud45c\ud604\uc774 \uc544\ub2c8\ub77c \uac15\uc778\ud558\uac8c \ub9d0\ud558\ub294 \uc704\ub85c\uc785\ub2c8\ub2e4.',
      meaning_ko: '\uac00\uc138\uc694 + \uc800\ub294 \uad1c\uc77c\uc2b5\ub2c8\ub2e4. \u2018\uad1c\uc77c\uc2b5\ub2c8\ub2e4\u2019\ub294 \uad1c\ucc2e\ub2e4\uc758 \ud569\uc1fc\uccb4\uc785\ub2c8\ub2e4. \uc5b4\ub978\uacfc \ucc98\uc74c \ubc1b\ub294 \ubd84, \uacf5\uc2dd\uc801 \uc0c1\ud669\uc5d0\uc11c \uc4c1\ub2c8\ub2e4.',
      example: 'A: "\ud1a0\uc589\ud560 \ub54c\uae4c\uc9c0 \uae30\ub2e4\ub824\ub3c4 \ub3fc\uc694?" B: "\uac00\uc138\uc694. \uc800\ub294 \uad1c\uc77c\uc2b5\ub2c8\ub2e4."',
      example_ko: 'A: "Should I wait until you get better?" B: "\uac00\uc138\uc694. \uc800\ub294 \uad1c\uc77c\uc2b5\ub2c8\ub2e4."',
      youtubeUrl: ''
    },
    {
      korean: '\uc774\ub4e4 \uacf3\uc744 \uc9c0\ucf1c\ub77c. \uae08\ubc29 \ub2e4\ub140\uc624\ub9c8.',
      romanization: 'Ideul gyeoteul jikyeora. Geumbang danyeoma.',
      english: 'Guard these people. I\u0027ll be right back.',
      partOfSpeech: 'expression',
      scene: 'Script p.7 \u2014 S#7. Kim Shin sees his family and servants gathered at the palace. He turns to his men and orders them to protect them. Then he walks alone toward the king. He says \u2018\uae08\ubc29 \ub2e4\ub140\uc624\ub9c8\u2019 knowing he will not come back.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 7\ud398\uc774\uc9c0 \u2014 S#7. \ud6e8\uc2e0\uacfc \ub178\ube44\ub4e4\uc774 \ubaa8\uc5ec \uc788\uc5b4\uc694. \uae40\uc2e0\uc774 \ub3cc\uc544\uc624\uc9c0 \ubabb\ud560 \uac78 \uc54c\uba74\uc11c\ub3c4 \ub2e4\ub140\uc624\uaca0\ub2e4 \ub9d0\ud558\ub294 \uc7a5\uba74\uc785\ub2c8\ub2e4.',
      meaning: '\uc9c0\ucf1c\ub77c = plain imperative of \uc9c0\ud0a4\ub2e4 (to protect/guard). \ub2e4\ub140\uc624\ub9c8 = \u201cI\u0027ll come back\u201d (informal, slightly archaic). \ub2e4\ub140\uc624\ub2e4 is \u2018to go somewhere and return\u2019, far warmer than \ub3cc\uc544\uc624\ub2e4. \u2018\uae08\ubc29\u2019 = right away/very soon.',
      meaning_ko: '\uc9c0\ucf1c\ub77c\ub294 \uc9c0\ud0a4\ub2e4\uc758 \ubc18\ub9d0 \uba85\ub839\ud615\uc785\ub2c8\ub2e4. \ub2e4\ub140\uc624\ub2e4\ub294 \uc5b4\ub514\uad50\ub97c \uac14\ub2e4\uac00 \ub3cc\uc544\uc628\ub2e4\ub294 \ub2f9\ubc31\ud55c \ub3cc\uc544\uc634\uc758 \ub530\ub73b\ud55c \ud45c\ud604\uc785\ub2c8\ub2e4. \uae08\ubc29 = \ubc14\ub85c/\uacf3.',
      example: 'A: "\uc5b4\ub514 \uac00\uc694?" B: "\uc794\ub59c \uae68\uc6cc 5\ubd84\uc774\uba74 \uae08\ubc29 \ub2e4\ub140\uc62c\uac8c\uc694."',
      example_ko: 'A: "Where are you going?" B: "Waking the kids \u2014 back in 5 minutes."',
      youtubeUrl: ''
    },
    {
      korean: '\uadf8 \ub204\uad6c\uc5d0\uac8c\ub3c4 \ube4c\uc9c0 \ub9c8\ub77c. ..\uc2e0\uc740 \ub4e3\uace0 \uc788\uc9c0 \uc54a\uc73c\ub2c8.',
      romanization: 'Geu nuguegedo bilji mara. ..Sineun deutgo itji anheuni.',
      english: 'Don\u0027t pray to anyone. The gods are not listening.',
      partOfSpeech: 'expression',
      scene: 'Script p.9 \u2014 S#8. Kim Shin lies dying in the field, his own sword through his chest. His servants are praying desperately to every god. He speaks one last time \u2014 not from despair, but from bitter clarity.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 9\ud398\uc774\uc9c0 \u2014 S#8. \ud750\ub4e4\ud310\uc5d0 \uc8d9\uc5b4\uac00\ub294 \uae40\uc2e0. \uc2dc\uc885\uc774 \ubaa8\ub4e0 \uc2e0\uc5d0\uac8c \uae30\ub3c4\ud558\uc9c0\ub9cc \uae40\uc2e0\uc774 \ub9c8\uc9c0\ub9c9\uc73c\ub85c \ud55c\ub9c8\ub514 \ud569\ub2c8\ub2e4.',
      meaning: '\ube4c\ub2e4 = to pray (to someone). \ub9c8\ub77c = plain negative imperative, don\u0027t ~. \ub4e3\uace0 \uc788\uc9c0 \uc54a\ub2e4 = is not listening. A sentence of complete loss of faith \u2014 yet said without tears. This stoicism defines Kim Shin\u2019s character.',
      meaning_ko: '\ube4c\ub2e4\ub294 \ub208\uac70\ub098 \uac04\uccad\ud558\ub2e4, \ub9c8\ub77c\ub294 \ubc18\ub9d0 \ubd80\uc815 \uba85\ub839\ud615\uc785\ub2c8\ub2e4. \uc2e0\uc740 \ub4e3\uace0 \uc788\uc9c0 \uc54a\ub2e4 \u2014 \uc2e0\uc5d0 \ub300\ud55c \uc644\uc804\ud55c \uc2e0\ub8a2\uc744 \uc78f\uc740 \ub9d0\uc774\uc9c0\ub9cc \ub208\ubb3c \ud558\ub098 \uc5c6\uc774 \ud569\ub2c8\ub2e4.',
      example: 'A: "\uae30\ub3c4\ud574\ubd10." B: "\uadf8 \ub204\uad6c\uc5d0\uac8c\ub3c4 \ube4c\uc9c0 \ub9c8. \uc2e4\uc9c8\uc801\uc73c\ub85c \uc0dd\uac01\ud574\uc57c\uc9c0."',
      example_ko: 'A: "Just pray about it." B: "Don\u0027t pray to anyone. Think practically."',
      youtubeUrl: ''
    },
    {
      korean: '..\ub9d0\ub3c4 \uc548 \ub3fc.. \uc65c \uc800\uae30.. \ub0b4\uac00 \uc65c \uc800\uae30..',
      romanization: '..Maldo an dwae.. Wae jeogi.. Naega wae jeogi..',
      english: 'That makes no sense\u2026 Why is that me\u2026 Why am I there\u2026',
      partOfSpeech: 'expression',
      scene: 'Script p.11 \u2014 S#10. 1998. A woman (Eun-tak\u2019s future mother) sees the body of a dead woman in a car trunk \u2014 wearing her own clothes and jewelry. She is looking at herself. Her reaction is this fractured, stuttering disbelief.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 11\ud398\uc774\uc9c0 \u2014 S#10. 1998\ub144. \uc790\ub3d9\ucc28 \ud2b8\ub7c9\ud06c\uc5d0\uc11c \uc790\uc2e0\uacfc \ub611\uac19\uc740 \uc637\uc744 \uc785\uc740 \uc2dc\uccb4\ub97c \ubc1c\uacac\ud55c \uc5ec\uc131(=\uc740\ud0c1\uc758 \uc5c4\ub9c8)\uc774 \ubb49\ub3c9\uadf8\ub80c\ud558\ub8cc \uc911\uc5bc\uac70\ub9ac\ub294 \uc7a5\uba74\uc785\ub2c8\ub2e4.',
      meaning: '\ub9d0\ub3c4 \uc548 \ub3fc = that doesn\u2019t even make sense. \uc654\uc544\ub9ac\ud604 stronger than \ub9d0\uc774 \uc548 \ub3fc\uc694. \uc65c \uc800\uae30 = why there (pointing). Broken, repeating speech is a realistic feature of severe shock in Korean drama \u2014 full sentences fall apart.',
      meaning_ko: '\ub9d0\ub3c4 \uc548 \ub3fc\ub294 \uc5b4\uc774\uc5c6\ub2e4, \ub9d0\uc774 \ub3fc\uc9c0 \uc54a\ub294\ub2e4\ub294 \ub5a0\uc774\ub2e4. \uc65c \uc800\uae30 = \uc65c \uac70\uae30\uc5d0. \uc2ec\ud55c \ucda9\uaca9\uc5d0 \ubb38\uc7a5\uc774 \uac08\ub77c\uc9c0\ub294 \ud55c\uad6d \uc601\uc0c1\uc758 \uc0ac\uc2e4\uc801 \ud45c\ud604 \ubc29\uc2dd\uc785\ub2c8\ub2e4.',
      example: 'A: "\ub2c8\uac00 \ucf54\ub4dc\uc624\ub958\ub85c \ub370\uc774\ud130 \ub2e4 \ub0a0\ub838\ub300." B: "\ub9d0\ub3c4 \uc548 \ub3fc. \ud558\ub3c8\uac00\uac00 \ubcf5\uad6c\ub294 \ub3fc\uc9c0?"',
      example_ko: 'A: "You deleted all the data with a code error." B: "\ub9d0\ub3c4 \uc548 \ub3fc. Is there a backup?"',
      youtubeUrl: ''
    },
    {
      korean: '\ub9c8\uc154\uc694. \uc774\uc2b9\uc758 \uae30\uc5b5\uc744 \uc78a\uac8c \ud574\uc90d\ub2c8\ub2e4.',
      romanization: 'Masyeoyo. Iseungui gieogeul itge haejumnida.',
      english: 'Drink it. It will make you forget the memories of this life.',
      partOfSpeech: 'expression',
      scene: 'Script p.12 \u2014 S#11. The Grim Reaper\u2019s tea shop. He places a cup of tea before the newly dead woman and delivers this line with total calm. It is both comfort and instruction. She asks what happens if she doesn\u2019t drink.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 12\ud398\uc774\uc9c0 \u2014 S#11. \uc800\uc2b9\uc758 \ucc3f\uc9d1. \uc800\uc2b9\uc0ac\uc790\uac00 \ub9d9\uac8c \ud830 \ucc3f\uc794\uc744 \ub0b4\ub193\uac10\uba74\uc11c \ub2f4\ub2f4\ud558\uac8c \ub9d0\ud569\ub2c8\ub2e4. \uc704\ub85c\uc774\uc790 \uc9c0\uc2dc\uc785\ub2c8\ub2e4.',
      meaning: '\ub9c8\uc154\uc694 = polite imperative of \ub9c8\uc2dc\ub2e4 (to drink). \uc774\uc2b9 = this life/this world (vs. \uc800\uc2b9 = the next world). \uae30\uc5b5\uc744 \uc78a\uac8c \ud574\uc90d\ub2c8\ub2e4 = will make you forget memories (causative: \uc78a\uac8c \ud558\ub2e4). This formal \ubbf8\ub798\uc2dc\uc81c is notably polite for a Grim Reaper speaking to the dead.',
      meaning_ko: '\ub9c8\uc154\uc694\ub294 \ub9c8\uc2dc\ub2e4\uc758 \uacf5\uc190 \uba85\ub839\ud615\uc785\ub2c8\ub2e4. \uc774\uc2b9\uc740 \uc774\ub9f9, \uc800\uc2b9\uc740 \uc800\uc138\uc0c1. \uc78a\uac8c \ud574\uc90d\ub2c8\ub2e4\ub294 \uc0ac\ub3d9\ud45c\ud604(\uc78a\uac8c \ud558\ub2e4)\uc785\ub2c8\ub2e4.',
      example: 'A: "\ub9c8\uc154\uc694. \uc774\uac74 \ubca0\ub9ac\ub97c \uc78a\uac8c \ud574\uc90d\ub2c8\ub2e4." B: "\uc548 \ub9c8\uc2dc\uba74 \uc5b4\ub5bb\uac8c \ub3bc\uc694?"',
      example_ko: 'A: "Drink it. This will make you forget the berries." B: "What happens if I don\u0027t?"',
      youtubeUrl: ''
    },
    {
      korean: '..\uc548 \ub9c8\uc2dc\uba74 \uc5b4\ub5bb\uac8c \ub3bc\ub370\uc694?',
      romanization: '..An masimyeon eotteoke doendaeyo?',
      english: 'What happens if I don\u0027t drink it?',
      partOfSpeech: 'expression',
      scene: 'Script p.12 \u2014 S#11. The dead woman questions the Grim Reaper. Despite being dead, she is not ready to let go of her life. This small act of resistance \u2014 asking rather than obeying \u2014 echoes in everything that follows.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 12\ud398\uc774\uc9c0 \u2014 S#11. \uc8fd\uc740 \uc5ec\uc131\uc774 \uc800\uc2b9\uc0ac\uc790\uc5d0\uac8c \ubb3b\uc2b5\ub2c8\ub2e4. \uace3\uc18c\ub85c \uc22b\uc2dc\uc9c0 \uc54a\uace0 \uc9c8\ubb38\ud558\ub294 \uc791\uc740 \uc800\ud56d\uc785\ub2c8\ub2e4.',
      meaning: '\uc548 + verb = not doing something. \ub9c8\uc2dc\uba74 = if I drink (conditional). \uc5b4\ub5bb\uac8c \ub3fc\ub370\uc694? = what will happen? \uc5b4\ub5bb\uac8c \ub3fc\ub2e4 is one of Korean\u2019s most useful phrases: \u201cwhat will happen\u201d / \u201cwhat\u2019s to be done?\u201d Essential conditional question structure.',
      meaning_ko: '\uc548 + \ub3d9\uc0ac\uba74 = \ub3d9\uc0ac\ud558\uc9c0 \uc54a\uc73c\uba74. \uc5b4\ub5bb\uac8c \ub3fc\ub370\uc694\ub294 \uc5b4\ub5bb\uac8c \ub420 \uac83\uc778\uac00\uc758 \uac00\uc7a5 \uc790\uc5f0\uc2a4\ub7ec\uc6b4 \ud45c\ud604\uc785\ub2c8\ub2e4. \ucf54\ub9ac\uc5b4 \ud559\uc2b5\uc790\uc5d0\uac8c \ud544\uc218\uc801\uc778 \uad6c\uc870\uc785\ub2c8\ub2e4.',
      example: 'A: "\uc774 \uc57d \uc548 \uba39\uc73c\uba74 \uc5b4\ub5bb\uac8c \ub3fc\ub370\uc694?" B: "\uc99d\uc0c1\uc774 \ub354 \uc2ec\ud574\uc9c8 \uc218 \uc788\uc5b4\uc694."',
      example_ko: 'A: "What happens if I don\u0027t take this medicine?" B: "Your symptoms could get worse."',
      youtubeUrl: ''
    },
    {
      korean: '\ub2c8\uac00 \ub355\ud654\uad6c\ub098. \ub098\ub294 \uadf8\ub300\uc758 \uc0bc\ucd08\uc774\uc5c8\ub2e4\uac00 \ud615\uc81c\uc600\ub2e4\uac00 \uc544\ub4e4\uc774\uc5c8\ub2e4\uac00 \uc190\uc790\uac00 \ub420 \uc0ac\ub78c\uc774\ub2e4.',
      romanization: 'Niga Deokhwaguna. Naneun geudeaui samchoniyeotdaga hyeongjeyeotdaga adeuliyeotdaga sonjaga doel saramida.',
      english: 'So you are Duk-hwa. I was your uncle, then your brother, then your son, and now I will be your grandson.',
      partOfSpeech: 'expression',
      scene: 'Script p.14 \u2014 S#13. The Goblin returns home after 20 years. He meets young Duk-hwa for the first time. He kneels to the child\u2019s eye level and says this. The child is confused. The audience is moved.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 14\ud398\uc774\uc9c0 \u2014 S#13. 20\ub144 \ub9cc\uc5d0 \uc9d1\uc73c\ub85c \ub3cc\uc544\uc628 \ub3c4\uae68\ube44\uac00 \uc5b4\ub9b0 \ub355\ud654\ub97c \ucc98\uc74c \ub9cc\ub098\ub294 \uc7a5\uba74. \uc544\uc774\uc758 \ub208\ub192\uc774\ub85c \uc54a\uc544 \uc774\ub807\uac8c \ub9d0\ud558\ub294 \ub3c4\uae68\ube44\uc785\ub2c8\ub2e4.',
      meaning: 'A powerful grammatical structure: \u201c\u2014\uc774\uc5c8\ub2e4\uac00\u201d chains past roles. \uc0bc\ucd08 = uncle, \ud615\uc81c = sibling, \uc544\ub4e4 = son, \uc190\uc790 = grandson. Using \ub098\ub294 (casual I) + \ud558\ub2e4\uac00 structure \u2014 each role was real, in a different lifetime. The cadence of immortality.',
      meaning_ko: '\u201c\u2014\uc774\uc5c8\ub2e4\uac00\u201d\ub294 \uacfc\uac70\uc758 \uc5f0\uc18d\uc801 \uc5ed\ud560\uc744 \ub098\uc5f4\ud558\ub294 \ubb38\ubc95 \uad6c\uc870\uc785\ub2c8\ub2e4. \uc0bc\ucd08/\ud615\uc81c/\uc544\ub4e4/\uc190\uc790 = \uac01 \uc0dd\uc758 \uc5ed\ud560. \ubd88\uba78\uc758 \ub9ac\ub4ec\uacfc \uc5f4\uac10\uc774 \ub2f4\uae41\ub2c8\ub2e4.',
      example: 'A: "\uc5ec\uae30 \ucc98\uc74c \uc640\uc694?" B: "\uc544\ub2c8\uc694, \ub098\ub294 \uc5ec\uae30\uc5d0\uc11c \ud559\uc0dd\uc774\uc5c8\ub2e4\uac00 \uc120\uc0dd\uc774\uc5c8\ub2e4\uac00 \uc774\uc81c \uad00\ub9ac\uc778\uc774 \ub50c \uc0ac\ub78c\uc785\ub2c8\ub2e4."',
      example_ko: 'A: "First time here?" B: "No, I was a student here, then a teacher, and now I\u0027ll be the manager."',
      youtubeUrl: ''
    },
    {
      korean: '\ub108\ubb34 \ub2e6\uac8c \uc640 \uc1a1\uad6c\ud569\ub2c8\ub2e4 \ub098\uc73c\ub9ac.',
      romanization: 'Neomu neutge wa songguhamnida, naoriri.',
      english: 'I\u0027m so sorry I came so late, my lord.',
      partOfSpeech: 'expression',
      scene: 'Script p.15 \u2014 S#15. Flashback. The original old servant stands before the sword, aged and dying. He apologises for coming late. He has been sick. The sword hums in response. Every generation of this family has served the Goblin \u2014 this is their farewell.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 15\ud398\uc774\uc9c0 \u2014 S#15. \uad6c\ud68c\uc0c1. \ucd5c\ucd08\uc758 \ub178\uc2dc\uc885\uc774 \uac80 \uc55e\uc5d0 \uc11c\uc11c \ub2a6\uac8c \uc640\uc11c \ubbf8\uc548\ud558\ub2e4\uace0 \ub9d0\ud569\ub2c8\ub2e4. \uc544\ud214\uc9c0\ub9cc \uc549\uc545\ud558\uc9c0 \uc54a\ub294 \uc791\ubcc4\uc785\ub2c8\ub2e4.',
      meaning: '\ub2a6\uac8c = late, \uc190\uad6c\ud569\ub2c8\ub2e4 = I\u2019m sorry (formal apology). \ub098\uc73c\ub9ac = archaic/formal address for a master (my lord). This is deep traditional Korean politeness: apologising for your own inadequacy, not blaming circumstances.',
      meaning_ko: '\ub2a6\uac8c\ub294 \ub9a6\ub2e4, \uc1a1\uad6c\ud569\ub2c8\ub2e4\ub294 \uc9c4\uc2ec\uc5b4\ub9b0 \uacf5\uc2dd \uc0ac\uacfc\uc785\ub2c8\ub2e4. \ub098\uc73c\ub9ac\ub294 \uc8fc\uc778\uc744 \ubd80\ub974\ub294 \uace0\uc5b4\uccb4 \ud638\uce6d\uc785\ub2c8\ub2e4. \ud55c\uad6d\uc758 \uc804\ud1b5\uc801\uc778 \uacf5\uc190\ud568\uc774 \ub2f4\uae41\ub2c8\ub2e4.',
      example: 'A: "\ub108\ubb34 \ub2a6\uac8c \uc640\uc11c \uc1a1\uad6c\ud569\ub2c8\ub2e4. \uc77c\uc774 \ub9ce\uc558\uc5b4\uc694." B: "\uad1c\uc790\uc57c\uc694. \ub2c8\uc99d\uac70 \uae30\ub2e4\ub838\uc5b4\uc694."',
      example_ko: 'A: "I\u0027m so sorry I came late. Work was busy." B: "It\u0027s fine. I was waiting for you."',
      youtubeUrl: ''
    },
    {
      korean: '\uc790\ub124\uac00 \ub0b4\uac00 \ubc1b\ub294.. \uccab \ubc88\uc9f8 \ubcc4\uc778 \ubaa8\uc591\uc774\ub2e4..',
      romanization: 'Janae ga naega batneun.. cheot beonjjae byeorin moyangida..',
      english: 'It seems\u2026 you are my first punishment.',
      partOfSpeech: 'expression',
      scene: 'Script p.17 \u2014 S#17. Kim Shin returns from his revenge to find the old servant has died. The servant\u2019s young grandson kneels before him. Kim Shin realises: his need for revenge cost this child his grandfather. He says this quietly, to himself.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 17\ud398\uc774\uc9c0 \u2014 S#17. \ubcf5\uc218\ub97c \ub9c8\uce58\uace0 \ub3cc\uc544\uc6b4 \uae40\uc2e0\uc774 \ub178\uc2dc\uc885\uc774 \uc8fd\uc5b4\uc788\ub294 \uac83\uc744 \ubc1c\uacac\ud569\ub2c8\ub2e4. \ub178\uc2dc\uc885\uc758 \uc190\uc790\uac00 \ubb34\ub9ce\uc774 \uc6b8\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uae40\uc2e0\uc774 \uc870\uc6a9\ud788 \ub9d0\ud569\ub2c8\ub2e4.',
      meaning: '\uc790\ub124 = you (archaic/formal), \ubcc4 = punishment, \uccab \ubc88\uc9f8 = first. \u2018\u2014\uc778 \ubaa8\uc591\uc774\ub2e4\u2019 = it seems to be ~. This soft hedging structure (\ubaa8\uc591\uc774\ub2e4) expresses a conclusion the speaker is reluctantly arriving at \u2014 not stating a fact, but seeing it.',
      meaning_ko: '\uc790\ub124\ub294 \ub108\uc758 \uc874\ub9c8\ub9d0 \uace0\uc5b4, \ubcc4\uc740 \ubcc4 \uc9d1\ud589, \uccab \ubc88\uc9f8\ub294 \ucab9\ubc88\uc9f8. \u201c\u2014\uc778 \ubaa8\uc591\uc774\ub2e4\u201d\ub294 \ub9d8\uc124\uc784\uc774\ub098 \ubb54\uce58 \uc798 \ubcf4\uc774\ub294 \uacb0\ub860\uc744 \ub098\ud0c0\ub0c5\ub2c8\ub2e4.',
      example: 'A: "\uc774\ubc88 \uc2e4\ud328\uac00 \ub0b4 \uccab \ubc88\uc9f8 \ud070 \ubcc4\uc778 \ubaa8\uc591\uc774\ub2e4." B: "\uadf8\ub7f0 \ub9d0 \ud558\uc9c0 \ub9c8. \uad70\ubcf5\ud560 \uc218 \uc788\uc5b4."',
      example_ko: 'A: "This failure seems to be my first real punishment." B: "Don\u0027t say that. You can recover."',
      youtubeUrl: ''
    },
    {
      korean: '\uc5c4\ub9c8.. \uc8fd\uc5c8\uc5b4\uc694?...',
      romanization: 'Eomma.. jugeosseoyo?...',
      english: 'Mum\u2026 did you die?...',
      partOfSpeech: 'expression',
      scene: 'Script p.24 \u2014 S#28. Eight-year-old Eun-tak is at home when her mother appears, ghost-like, behind the birthday candles. Eun-tak lights the candles and sees her mother\u2019s face flicker. She stops chattering and goes very still. Then asks this.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b8 24\ud398\uc774\uc9c0 \u2014 S#28. \uc5ec\ub35f \uc82f \uc740\ud0c1\uc774 \uc5c4\ub9c8\uc758 \uc591\ub85c \uc139\uc778\uc5d0\uc11c \ub54c\ub97c \ucf1c\ub2e4\uac00 \ubab8\uc774 \uc548\uc800\uc9c1\ud569\ub2c8\ub2e4. \uadf8\ub9ac\uace0 \uc774 \ud55c \ub9c8\ub514\ub97c \ub451\ub2c8\ub2e4.',
      meaning: '\uc8fd\ub2e4 = to die, \uacfc\uac70\ud615 \uc758\ubb38 \uc8fd\uc5c8\uc5b4\uc694? is very soft \u2014 almost hoping she\u2019s wrong. The \uc5c4\ub9c8 at the start is a heartbreaker: children use this casual address word. No formal prefix, no title. Just \uc5c4\ub9c8.',
      meaning_ko: '\uc8fd\ub2e4\uc758 \uacfc\uac70 \uc758\ubb38\ud615 \uc8fd\uc5c8\uc5b4\uc694?\ub294 \ub9e4\uc6b0 \ubd80\ub4dc\ub7ec\uc6c0\uc785\ub2c8\ub2e4. \ub2f5\uc744 \uc57c \uc54c\uba74\uc11c\ub3c4 \ud5c8\ubb3c\ud5c8\ubb3c \ud558\ub294 \ud601\uc2b9\uc0dd\uac01\uac19\uc740 \uc5b4\ubbf8 \ud55c \ub9c8\ub514\uac00 \uc544\ud504\uac8c \ub9b4\ub9bd\ub2c8\ub2e4.',
      example: 'A: "\ub204\uac00 \uc6c0\uc9c0 \ub9d0\ub79c\ub2e4 \ud588\uc5b4?" B: "\ud0c1\uc544.. \ub098\ud55c\ud14c \ud654\ub0a8\ub294 \uac70\uc57c?..."',
      example_ko: 'A: "Who said you couldn\u0027t cry?" B: "Taka\u2026 are you angry at me?..."',
      youtubeUrl: ''
    },
    {
      korean: '\ubbf8\uc548\ud574\uc694 \uc5c4\ub9c8. \uadf8\ub7f0 \uac70 \ubd10\uc11c\uc694. \uadfc\ub370 \ub0b4\uac00 \uadf8\ub7f0 \uac70 \ubd10\uc11c \uc774\ub807\uac8c \uc5c4\ub9c8\ub3c4 \ubd07 \uc218 \uc788\ub294 \uac70\ub2c8\uce74 \ub09c \uadf8\ub0e5 \uad1c\uc77c\uc544\uc694.',
      romanization: 'Mianhaeyo eomma. Geureon geo bwaseoyo. Geunde naega geureon geo bwaseo ireoke eomma do bol su itneun geonikka nan geunyang gwaenchana yo.',
      english: "I'm sorry, Mum, for seeing those things. But because I can see them, I can see you too right now \u2014 so I'm just\u2026 okay.",
      partOfSpeech: 'expression',
      scene: 'Script p.25 \u2014 S#28. Eun-tak\u2019s mother is fading. Eun-tak has always felt guilty for being able to see ghosts \u2014 she thinks it burdened her mother. In their farewell she reverses this: her ability is also what lets her see her mother one last time.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 25\ud398\uc774\uc9c0 \u2014 S#28. \uc5b4\ub9c8\ub2c8\uac00 \ud760\ub9bf\ud560 \ub54c \uc740\ud0c1\uc774 \ud558\ub294 \uc791\ubcc4\uc778\uc0ac. \uc790\uc2e0\uc774 \uadc0\uc2e0\uc744 \ubcbc \uc218 \uc788\ub294 \uac83\uc774 \uc5c4\ub9c8\ub97c \ub9c8\uc9c0\ub9c9\uc73c\ub85c \ubcfc \uc218 \uc788\uac8c \ud574\uc900 \uac83\uc774\uc5c8\ub2e4\ub294 \uac83\uc744 \uae68\ub2e5\ub294 \ub9d0\uc785\ub2c8\ub2e4.',
      meaning: 'A pivotal \uadfc\ub370 (\uadf8\ub7f0\ub370, but\u2026): reversing the apology. \ub09c \uadf8\ub0e5 \uad1c\uc77c\uc544\uc694 = I\u2019m just okay. The word \uadf8\ub0e5 (just/simply) here carries immense weight: she is not fine. She is choosing to say she is fine, for her mother\u2019s sake.',
      meaning_ko: '\uadfc\ub370\ub294 \uc5ec\uae30\uc11c \ub180\ub77c\uc6b4 \ubc18\uc804\uc744 \ub9cc\ub4e6\ub2c8\ub2e4. \uadf8\ub0e5 \uad1c\uc77c\uc544\uc694 \u2014 \uc804\ud600 \uad1c\uc77c\uc9c0 \uc54a\uc9c0\ub9cc \uc5c4\ub9c8\ub97c \uc704\ud574 \uad1c\uc77c\ub2e4\uace0 \uc120\ud0dd\ud558\ub294 \ub9d0\uc785\ub2c8\ub2e4.',
      example: 'A: "\ub108 \uc9c4\uc9dc \uad1c\uc77c\uc57c?" B: "\uadfc\ub370 \ub0b4\uac00 \uadf8\ub807\uac8c \ud588\uc73c\ub2c8\uae4c \uc774\uac74 \ub0b4\uac00 \ubab8 \ub2f4\uc544\uc57c \ud558\ub294 \uac70\ub2c8\uae4c \ub09c \uadf8\ub0e5 \uad1c\uc77c\uc544."',
      example_ko: 'A: "Are you really okay?" B: "But since I chose this, I have to carry it \u2014 so I\u2019m just okay."',
      youtubeUrl: ''
    },
    {
      korean: '\ub3c4\uae68\ube44 ??!! (\ub6f1\uc9c0? \uc65c\uc9c0? \uc65c \ud558\ub098\ub3c4 \uc548 \ubcf4\uc774\uc9c0 \uc800 \uc560\ub294?',
      romanization: 'Dokkaebi ??!! (Dwiji? Waeji? Wae hanaedo an boiji jeo aeneun?)',
      english: '(Goblin\u2019s thought) Wait\u2026 why\u2026 why can\u2019t I see anything about that girl?',
      partOfSpeech: 'expression',
      scene: 'Script p.30 \u2014 S#34. Street scene. Adult Eun-tak passes Kim Shin on a rainy street. Their umbrellas nearly touch. Kim Shin stops. He can\u2019t see her future at all \u2014 it\u2019s blank. He is rattled.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 30\ud398\uc774\uc9c0 \u2014 S#34. \uac70\ub9ac. \ube57\uc18d\uc5d0\uc11c \uc2a4\uce58\ub294 \uc740\ud0c1\uacfc \uae40\uc2e0. \uae40\uc2e0\uc740 \ubaa8\ub4e0 \uc0ac\ub78c\uc758 \ubbf8\ub798\uac00 \ubcf4\uc774\ub294\ub370 \uc774 \uc544\uc774\ub9cc \uc5c6\uc2b5\ub2c8\ub2e4. \ub2f9\ud669\ud558\ub294 \ub3c4\uae68\ube44\uc785\ub2c8\ub2e4.',
      meaning: '\uc8fc\ubaa9\ud560 \uc810: \uc774 \ub300\uc0ac\ub294 \ub3c4\uae68\ube44\uc758 \ub0b4\uba74 \ub3c5\ubc31\uc785\ub2c8\ub2e4. \ub6f1\uc9c0 = is it because of my back? \uc65c\uc9c0 = why is that? \ud558\ub098\ub3c4 \uc548 \ubcf4\uc774\ub2e4 = nothing is visible. This triple repetition (\ub6f1\uc9c0? \uc65c\uc9c0? \uc65c?) mimics real confused thinking \u2014 brain catching up to perception.',
      meaning_ko: '\ub3c4\uae68\ube44\uc758 \ub0b4\uba74 \ub3c5\ubc31\uc785\ub2c8\ub2e4. \ub6f1\uc9c0, \uc65c\uc9c0\ub294 \ub2f9\ud639\ud558\ub294 \uc0dd\uac01\uc758 \ud750\ub984\uc785\ub2c8\ub2e4. \ud558\ub098\ub3c4 \uc548 \ubcf4\uc774\ub2e4\ub294 \uc544\ubb34\uac83\ub3c4 \uc548 \ubcf4\uc778\ub2e4\ub294 \uac15\ud55c \ubd80\uc815\uc785\ub2c8\ub2e4.',
      example: 'A: "\uc65c\uc9c0? \uc65c \ud558\ub098\ub3c4 \uc548 \uac19\uc544 \ubcf4\uc774\uc9c0? \ub9f4\uac00 \uc2e0\uacbd \uc4f0\uc774\ub294 \uc0ac\ub78c\uc774\uc57c?"',
      example_ko: 'A: "Why\u2026 why does nothing about them add up? Who is this person?"',
      youtubeUrl: ''
    },
    {
      korean: '\uc0dd\uc77c \ucd95\ud558 \uac10\uc0ac\ud569\ub2c8\ub2e4. \uc774\ubaa8.',
      romanization: 'Saengil chukha gamsahamnida. Imo.',
      english: 'Thank you for the birthday wishes. Aunt.',
      partOfSpeech: 'expression',
      scene: 'Script p.33 \u2014 S#37. It\u2019s Eun-tak\u2019s birthday. Her aunt insults her. Her cousin ridicules her. She says this \u2014 completely sincerely, without irony. She has no one. She is thanking the person tormenting her, because no one else said it.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 33\ud398\uc774\uc9c0 \u2014 S#37. \uc740\ud0c1\uc758 \uc0dd\uc77c. \uc774\ubaa8\ub294 \uc695\uc744 \ud558\uace0 \uc0ac\ucd98\uc740 \uc870\ub86d\ud569\ub2c8\ub2e4. \uc740\ud0c1\uc740 \uc9c4\uc2ec\uc73c\ub85c \uc774 \ud55c \ub9c8\ub514\ub97c \ud569\ub2c8\ub2e4.',
      meaning: '\ucd95\ud558\ud569\ub2c8\ub2e4 = congratulations/celebration, \uac10\uc0ac\ud569\ub2c8\ub2e4 = thank you \u2014 both in one sentence. Very formal phrasing for a family context, which reveals Eun-tak\u2019s emotional distance from her aunt. She is polite to someone who doesn\u2019t deserve it.',
      meaning_ko: '\uc0dd\uc77c \ucd95\ud558 \uac10\uc0ac\ud569\ub2c8\ub2e4\ub294 \uc131\uc778\ub4e4\uc0ac\uc774\uc5d0 \ub108\ubb34 \uacf5\uc2dd\uc801\uc778 \ud45c\ud604\uc785\ub2c8\ub2e4. \uc740\ud0c1\uc758 \uc774\ubaa8\uc640\uc758 \uc815\uc11c\uc801 \uac70\ub9ac\uac10\uc744 \ub4dc\ub7ec\ub0c5\ub2c8\ub2e4.',
      example: 'A: "\ucc38\uc5ac\ud574\uc918\uc11c \uac10\uc0ac\ud569\ub2c8\ub2e4." B: "\ub2f9\uc5f0\ud55c \uac70\uc8e0."',
      example_ko: 'A: "Thank you for coming." B: "Of course."',
      youtubeUrl: ''
    },
    {
      korean: '\ub0a0 \ubd88\ub7ec\ub0b8 \uac8c \ub108\ub294\uace0.',
      romanization: 'Nal bulreonaen ge neoraneungo.',
      english: 'You\u2019re the one who summoned me.',
      partOfSpeech: 'expression',
      scene: 'Script p.37 \u2014 S#43. Eun-tak blows out candles on her birthday cake by the sea. The Goblin appears behind her. She jumps in alarm. He faces her steadily and says this. She has been summoning him with fire all her life, without knowing.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 37\ud398\uc774\uc9c0 \u2014 S#43. \ud574\ubcc0\uc5d0\uc11c \ub178\ub798\ub97c \uc7e0\ub2f9\uc804 \uc740\ud0c1\uc774 \ucf5c\uc558\ub2e4 \ub044\uc9c0\uba74 \ub3c4\uae68\ube44\uac00 \ub098\ud0d0\ub0a9\ub2c8\ub2e4. \uadf8\uac00 \ub2f4\ub2f4\ud558\uac8c \ub9d0\ud569\ub2c8\ub2e4.',
      meaning: '\ub0a0 = me (short for \ub098\ub97c), \ubd88\ub7ec\ub0b4\ub2e4 = to summon/call out, \uac8c = subject marker (colloquial). \u201c\u2014\ub294\uace0\u201d is a confirmatory question: \u201cit\u2019s ~ right?\u201d or \u201cyou\u2019re ~ aren\u2019t you?\u201d Common in everyday speech. Casual, slightly accusatory here.',
      meaning_ko: '\ubd88\ub7ec\ub0b4\ub2e4\ub294 \uc18c\ud658\ud558\ub2e4, \ubd88\ub7ec\ub0b4\ub2e4\uc785\ub2c8\ub2e4. \u201c\u2014\ub294\uace0\u201d\ub294 \ud655\uc778 \uc758\ubb38\ubb38 \uad6c\uc870\uc785\ub2c8\ub2e4. \ud558\uc774\uc18c\uccb4 \uc22b\uc790\ub9ac\ud65c\uc5d0\uc11c \uc790\uc8fc \uc4f0\ub294 \ud45c\ud604\uc785\ub2c8\ub2e4.',
      example: 'A: "\ub0a0 \uc77c\ubd80\ub7ec \uc2e0\uace0\ud55c \uac8c \ub108\ub294\uace0." B: "\uc544\ub2c8\uc57c. \uc624\ud574\uc57c."',
      example_ko: 'A: "You\u0027re the one who reported me intentionally, aren\u0027t you." B: "No. It\u2019s a misunderstanding."',
      youtubeUrl: ''
    },
    {
      korean: '\uc544\uc800\uc528 \uadc0\uc2e0\uc774\uac19\uc544\uc694. \uc81c\uac00 \uadc0\uc2e0\uc744 \ubcf4\uac70\ub4e0\uc694.',
      romanization: 'Ajeossi gwisinigatayo. Jega gwisineul bogeogeunyo.',
      english: 'You seem like a ghost. I can see ghosts, you know.',
      partOfSpeech: 'expression',
      scene: 'Script p.37 \u2014 S#43. First conversation. Eun-tak studies the Goblin and delivers her analysis. She can see ghosts \u2014 she\u2019s used to classifying what she sees. She says this almost matter-of-factly, the way she would tell someone they have spinach in their teeth.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 37\ud398\uc774\uc9c0 \u2014 S#43. \uccab \ub300\ud654. \uc740\ud0c1\uc774 \ub3c4\uae68\ube44\ub97c \uc9c0\uadf8\uc2dc \uc5b4\ub2e4 \ubcf4\ub294 \ud5c8\uc774\uace0 \ub9d0\ud569\ub2c8\ub2e4. \ud3c9\uc0dd \uae30\uc2e0\uc744 \ubd84\ub958\ud574\uc628 \uc0ac\ub78c\uc5d0\uac8c \ub2f9\uc5f0\ud55c \ubd84\uc11d\uc785\ub2c8\ub2e4.',
      meaning: '\uadc0\uc2e0\uc774\uac19\ub2e4 = to seem like a ghost. \u2018\u2014\uc774\uac19\ub2e4\u2019 = to seem like, to resemble. Polite: \uadc0\uc2e0\uc774\uac19\uc544\uc694. \ubcf4\uac70\ub4e0\uc694 = because I see them (giving context/reason). \u2018\u2014\uac70\ub4e0\uc694\u2019 is a key expression: it adds \u201cbecause you see, / the thing is, ~\u201d.',
      meaning_ko: '\uadc0\uc2e0\uc774\uac19\ub2e4\ub294 \uadc0\uc2e0\ucc98\ub7fc \ubcf4\uc778\ub2e4\ub294 \ube44\uad50 \ud45c\ud604\uc785\ub2c8\ub2e4. \u201c\u2014\uac70\ub4e0\uc694\u201d\ub294 \uc774\uc720\ub098 \ubc30\uacbd\uc744 \ub354\ud558\ub294 \uc911\uc694\ud55c \ud45c\ud604\uc785\ub2c8\ub2e4. \u201c\uc81c\uac00 \uad6c\uac00 \ub54c\ubb38\uc5d0\ub9d0 \u2014\uc6a9\uc774\ub294\ub370\uc694\u201d\uc640 \ub611\uac19\uc2b5\ub2c8\ub2e4.',
      example: 'A: "\uc54c\uc544\ubcf4\ub2c8\uc9c0? \uc81c\uac00 \uc624\ub798 \uc5ec\uae30\uc11c \uc77c\ud588\uac70\ub4e0\uc694." B: "\uc544, \uadf8\ub798\uc11c \uc9c0\ub9ac\ub97c \uc798 \uc544\uc2dc\ub294\uad70\uc694."',
      example_ko: 'A: "You seem familiar \u2014 I\u0027ve worked here a long time, you see." B: "Ah, that\u2019s why you know the area well."',
      youtubeUrl: ''
    },
    {
      korean: '\uc2a4\ubb34 \uc0b4, \uc11c\ub978 \uc0b4, \ub108\uc758 \ubbf8\ub798.',
      romanization: 'Seummu sal, seorun sal, neoui mirae.',
      english: 'Twenty years old, thirty years old \u2014 your future.',
      partOfSpeech: 'expression',
      scene: 'Script p.37 \u2014 S#43. Kim Shin tells Eun-tak he can normally see a person\u2019s future. She asks what he sees when he looks at her. He pauses\u2026 and then says only this. Two ages. No more. Because there is nothing beyond thirty in what he can see.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 37\ud398\uc774\uc9c0 \u2014 S#43. \uae40\uc2e0\uc774 \ud3c9\uc18c \uc0ac\ub78c\uc758 \ubbf8\ub798\ub97c \ubcfc \uc218 \uc788\ub2e4\uace0 \ud569\ub2c8\ub2e4. \uc740\ud0c1\uc774 \uc790\uc2e0\uc5d0 \ub300\ud574 \ubb50\uac00 \ubcf4\uc774\ub290\ub0c8\ub294\uac00 \ubb3b\uc790 \uac10\uc2dc \ub9c9\ud5c8 \uc774 \ub450 \uc5f0\ub839\ub9cc \ub9d0\ud569\ub2c8\ub2e4.',
      meaning: 'Age expressions in Korean: \uc0b4 is the counter for age (years old). \uc2a4\ubb34 = twenty, \uc11c\ub978 = thirty. Using just numbers and \uc0b4 with no verb is dramatic compression \u2014 Korean allows this fragmented style to convey more than a complete sentence would.',
      meaning_ko: '\uc0b4\uc740 \ub098\uc774\ub97c \uc138\ub294 \ub2e8\uc704\uc785\ub2c8\ub2e4. \uc2a4\ubb34 = 20, \uc11c\ub978 = 30. \ub3d9\uc0ac \uc5c6\uc774 \uc22b\uc790\ub9cc \ub098\uc5f4\ud558\ub294 \ubc29\uc2dd\uc774 \uc624\ud788\ub824 \ub354 \ub9ce\uc740 \uac83\uc744 \ub9d0\ud569\ub2c8\ub2e4.',
      example: 'A: "\ub124 \ubbf8\ub798\uac00 \ubcf4\uc5ec\uc694?" B: "\uc2a4\ubb34\ub2e4\uc12f \uc0b4. \uac15\ud55c \ubaa9\uc18c\ub9ac. \uadf8\uac83\ubc16\uc5d0."',
      example_ko: 'A: "Can you see my future?" B: "Twenty-five. A strong voice. That\u2019s all."',
      youtubeUrl: ''
    },
    {
      korean: '\uae7c\ub3c4 \ub3fc\uc694. \ub098 \uc624\ub298 \uc0dd\uc77c\uc774\uac70\ub4e0\uc694. \uc544\uc8fc \uc6b0\uc6b8\ud55c \uc0dd\uc77c.',
      romanization: 'Gwido dwaeyo. Na oneul saengirieogeonyo. Aju uureun saengil.',
      english: 'Bother if you like. Today\u2019s my birthday, you see. A very gloomy birthday.',
      partOfSpeech: 'expression',
      scene: 'Script p.38 \u2014 S#43. Kim Shin tells her she can ask questions or leave. She says this: announcing her birthday not as a celebration but as an explanation for everything \u2014 why she\u2019s here alone, why she made wishes, why she talked to a stranger.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 38\ud398\uc774\uc9c0 \u2014 S#43. \uae40\uc2e0\uc774 \ub4e3\uac70\ub098 \uac00\uac70\ub098 \ud558\ub77c\uace0 \ud558\uc790 \uc740\ud0c1\uc774 \uc774\ub807\uac8c \uc790\uc2e0\uc758 \uc0dd\uc77c\uc744 \ucd95\ud558\uac00 \uc544\ub2cc \uc124\uba85\uc73c\ub85c \uace0\uc2a4\ub780\ud788 \ub9d0\ud569\ub2c8\ub2e4.',
      meaning: '\uae7c\ub3c4 \ub3fc\uc694 = it\u2019s okay even if you bother me. \u2018\u2014\ub3c4 \ub3fc\ub2e4\u2019 = it\u2019s fine even if ~. \uc6b0\uc6b8\ud558\ub2e4 = to be gloomy/melancholy. Eun-tak\u2019s self-awareness about her own unhappiness, delivered with total composure, is one of her defining traits.',
      meaning_ko: '\uae7c\ub3c4 \ub3fc\uc694\ub294 \uadc0\ub2e4\ub9e4\uc5ec\ub3c4 \uad1c\ucc2e\ub2e4\ub294 \ud5c8\ub77d\ud45c\ud604\uc785\ub2c8\ub2e4. \uc6b0\uc6b8\ud558\ub2e4\ub294 \ubb44\ucfe8\ud558\uace0 \uce68\uccb4\ud55c \uc0c1\ud0dc\uc785\ub2c8\ub2e4. \uc8fc\uc778\uacf5\uc758 \ub3c5\ud2b9\ud55c \uc790\uc5f0\uc2a4\ub7ec\uc6c0\uc774 \ub2f4\uae41\ub2c8\ub2e4.',
      example: 'A: "\uc8fc\ub9d0\uc5d0 \uc5f0\ub77d\ud574\ub3c4 \ub3fc\uc694?" B: "\uae7c\ub3c4 \ub3fc\uc694. \uc800 \uc694\uc998 \uac4c\uc18d\uac70\ub4e0\uc694."',
      example_ko: 'A: "Can I contact you on weekends?" B: "That\u2019s fine. I\u2019m stuck at home these days, you see."',
      youtubeUrl: ''
    },
    {
      korean: '\uafc8\uafd9\ud558\uac8c \ud588\ub2e4. \ubcf4\uc5ec\uc918\uc11c \ucda9\uaca9\uc774\uc57c. \uc9c4\uc9dc \ucc98\uc74c\uc774\uc57c \uc9c4\uc9dc.',
      romanization: 'Kkumkkulhage haettda. Boyeojwoseo chunggyeogiya. Jinjja cheoeumiiya jinjja.',
      english: 'You built up hope. The fact that you showed yourself \u2014 it\u2019s a shock. It\u2019s genuinely the first time. Truly.',
      partOfSpeech: 'expression',
      scene: 'Script p.38 \u2014 S#43. Eun-tak confronts Kim Shin about the effect of his appearances and disappearances. She is not angry \u2014 she is staggered. In 19 years, no one has ever shown up for her. The word \uccab\uc5e0 (\uccab \ubc88\uc9f8/\uccab\uc774\uc57c) lands hard.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 38\ud398\uc774\uc9c0 \u2014 S#43. \uc740\ud0c1\uc774 \uae40\uc2e0\uc758 \ub2f9\uc2ec\uc740 \ud589\ub3d9\uc774 \uc790\uc2e0\uc5d0\uac8c \uc5bc\ub9c8\ub098 \ucda9\uaca9\uc774\uc5c8\ub294\uc9c0 \ub9d0\ud569\ub2c8\ub2e4. 19\ub144 \uc778\uc0dd\uc5d0 \ub204\uad6c\ub3c4 \ubcf4\uc5ec\uc8fc\uc9c0 \uc54a\uc558\ub358 \uac83\uc785\ub2c8\ub2e4.',
      meaning: '\uafc8\uafd9\ud558\uac8c \ud558\ub2e4 = to give someone hope/let them dream. \uccab\uc774\uc57c = it\u2019s a first (emphatic). \uc9c4\uc9dc = truly/really. Repetition of \uc9c4\uc9dc is not redundancy \u2014 it\u2019s emphasis, even disbelief. The Goblin stands in silence.',
      meaning_ko: '\uafc8\uafd9\ud558\uac8c \ud558\ub2e4\ub294 \uc0ac\ub78c\uc744 \ub2f9\uc2ec\ud558\uac8c \ud558\ub2e4\ub294 \uc758\ubbf8\uc785\ub2c8\ub2e4. \uccab\uc774\uc57c = \ucc98\uc74c\uc774\ub2e4. \uc9c4\uc9dc \uc9c4\uc9dc\ub294 \uc911\ubcf5\uc774 \uc544\ub2cc \uac10\ub3d9\uc758 \uac15\uc870\uc785\ub2c8\ub2e4.',
      example: 'A: "\uc5ec\ud589 \ub2e4\ub140\uc628 \uc801 \uc788\uc5b4\uc694?" B: "\uc9c4\uc9dc \uccab\uc774\uc57c. \uc9c4\uc9dc."',
      example_ko: 'A: "Have you ever travelled abroad?" B: "Truly the first time. Truly."',
      youtubeUrl: ''
    },
    {
      korean: '\ub098 \uc54c\uc558\uc5b4\uc694! \uc5b4\ub5bb\uac8c \ubd80\ub974\ub294\uc9c0 \uc54c\uc558\uc5b4\uc694!',
      romanization: 'Na arasso! Eotteoke bureuneunjiasso!',
      english: 'I figured it out! I know how to summon you!',
      partOfSpeech: 'expression',
      scene: 'Script p.43 \u2014 S#49. Church. Eun-tak has been blowing out candles all over the city, testing if it always works. She blows a candle at the altar and the Goblin appears behind her. She spins around triumphant. This is her \u201cEureka\u201d moment.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 43\ud398\uc774\uc9c0 \u2014 S#49. \uc131\ub2f9. \uc740\ud0c1\uc774 \ub3c4\uc2dc \uace3\uacf3\uc758 \ucd09\ubd88\uc744 \ub2e4 \ub044\ubcf4\uba70 \uc2e4\ud5d8\ud588\uc2b5\ub2c8\ub2e4. \uc81c\ub2e8\uc758 \ucd09\ubd88\uc744 \ub04c\uc790 \ub3c4\uae68\ube44\uac00 \ub098\ud0d0\ub2d9\ub2c8\ub2e4. \uad1c\uc131\uc2a4\ub7ec\uc6b4 \uc21c\uac04\uc785\ub2c8\ub2e4.',
      meaning: '\uc54c\ub2e4 = to know, past form \uc54c\uc558\ub2e4. \uc5b4\ub5bb\uac8c = how. This is a triumphant realization sentence: \u201cI know + how to ~!\u201d The exclamation marks in the script are rare \u2014 this is a big moment for Eun-tak, delivered at full volume.',
      meaning_ko: '\uc54c\ub2e4\ub294 \uc54c\ub2e4, \uc54c\uc558\ub2e4\ub294 \uacfc\uac70\ud615\uc785\ub2c8\ub2e4. \uc5b4\ub5bb\uac8c = \uc5b4\ub5bb\uac8c. \ub4dc\ub77c\ub9c8 \ub0b4\uc5d0\uc11c \ub4dc\ubb3c\uac8c \ub098\uc624\ub294 \ud765\ubd84\ub41c \uc21c\uac04\uc785\ub2c8\ub2e4.',
      example: 'A: "\ub098 \uc54c\uc558\uc5b4! \uc5b4\ub5bb\uac8c \uce20\ub2e4\uac00 \uc5f0\ub77d\ud558\ub294\uc9c0 \uc54c\uc558\uc5b4!" B: "\ub9d0\ud574\ubd10, \uc5b4\ub5bb\uac8c?"',
      example_ko: 'A: "I figured it out! I know how to get in touch without ringing!" B: "Tell me, how?"',
      youtubeUrl: ''
    },
    {
      korean: '\uc5ec\uae30\uc120 \uc548 \ub3fc. \ube44\ubd80\uc7a5 \uc9c0\ub300 \ub654 \uadf8\ub7f0 \uac70\ub77c\uace0 \uc0dd\uac01\ud558\uba74 \ub3fc. \ub530\ub77c\uc624\uc9c0 \ub9d0\uace0.',
      romanization: 'Yeogiseon an dwae. Bibujangjidae mwo geureon georago saenggakhamyeon dwae. Tara-oji malgo.',
      english: 'It doesn\u2019t work here. Just think of it as some kind of demilitarised zone or something. Don\u2019t follow me.',
      partOfSpeech: 'expression',
      scene: 'Script p.43 \u2014 S#49. Kim Shin tries to vanish inside the church. He can\u2019t. He looks annoyed and explains. \ube44\ubd80\uc7a5\uc9c0\ub300 = DMZ (demilitarized zone) \u2014 the Goblin describing a church as a dead zone for his powers is pure situational comedy.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 43\ud398\uc774\uc9c0 \u2014 S#49. \uc131\ub2f9 \uc548\uc5d0\uc11c \uc0ac\ub77c\uc9c0\ub824\ub294 \uae40\uc2e0. \uc548 \ub3fc\uc5b4\uc694. \uc575\ub2f9\ud55c \ud45c\uc815\uc73c\ub85c \uc124\uba85\ud569\ub2c8\ub2e4. \uc131\ub2f9\uc744 \ube44\ubd80\uc7a5\uc9c0\ub300\ub85c \ube44\uc720\ud558\ub294 \uc704\ud2b8\uc785\ub2c8\ub2e4.',
      meaning: '\uc548 \ub3fc = it doesn\u2019t work (very colloquial). \u2018\u2014(으)라고 생각하면 돼\u2019 = just think of it as ~. \ub530\ub77c\uc624\uc9c0 \ub9d0\uace0 = negative imperative: don\u0027t follow. The contrast between the Goblin\u2019s ancient dignity and this very casual modern explanation is very funny.',
      meaning_ko: '\uc548 \ub3fc\ub294 \uc548 \ub41c\ub2e4\uc758 \uc77c\uc0c1\uccb4 \ud45c\ud604\uc785\ub2c8\ub2e4. \u2018\u2014\ub77c\uace0 \uc0dd\uac01\ud558\uba74 \ub3fc\u2019\ub294 \ub300\uce60 \uc124\uba85 \ud45c\ud604\uc785\ub2c8\ub2e4. \ub530\ub77c\uc624\uc9c0 \ub9d0\uace0\ub294 \ubd80\uc815 \uba85\ub839\ud615\uc785\ub2c8\ub2e4.',
      example: 'A: "\uc5ec\uae30\uc120 \uc548 \ub3fc. \ube44\ubc00\uad6c\uc5ed\uc774\ub77c\uace0 \uc0dd\uac01\ud558\uba74 \ub3fc." B: "\uc5bc\ub9c8\ub098 \uc624\ub798 \ube44\ubc00\ub85c \uc788\uc5b4\uc57c \ud574\uc694?"',
      example_ko: 'A: "It doesn\u0027t work here. Just think of it as a restricted area." B: "How long do I have to keep it secret?"',
      youtubeUrl: ''
    },
    {
      korean: '\uc800 \ub3c4\uae68\ube44 \uc2e0\ubd80\uac70\ub4e0\uc694.',
      romanization: 'Jeo dokkaebi sinbugeogeunyo.',
      english: 'I\u2019m the Goblin\u2019s bride, you see.',
      partOfSpeech: 'expression',
      scene: 'Script p.45 \u2014 S#50. Library. Eun-tak grabs Kim Shin\u2019s arm to stop him leaving and announces this. Not as a question. Not with hesitation. As a simple statement of fact. He freezes. She has claimed the title as her own.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 45\ud398\uc774\uc9c0 \u2014 S#50. \ub3c4\uc11c\uad00. \uc740\ud0c1\uc774 \uae40\uc2e0\uc758 \ud314\uc744 \uc7a1\uc544 \uc138\uc6b0\uba74\uc11c \uc774\ub835\uac8c \uc120\uc5b8\ud569\ub2c8\ub2e4. \uc9c8\ubb38\ub3c4 \ub9dd\uc124\uc784\ub3c4 \uc5c6\uc774, \uc0ac\uc2e4\ub85c\uc11c \ub9d0\ud569\ub2c8\ub2e4.',
      meaning: '\uc800 = I (humble formal), \ub3c4\uae68\ube44 \uc2e0\ubd80 = the Goblin\u2019s bride, \u2018\u2014\uac70\ub4e0\uc694\u2019 = you see / the thing is. Eun-tak\u2019s use of \uc800 (formal I) here \u2014 instead of the casual \ub098 she normally uses \u2014 signals she is making a serious, dignified claim.',
      meaning_ko: '\uc800\ub294 \uacf5\uc190\ud55c 1\uc778\uce6d, \uc2e0\ubd80\ub294 \uc2e0\ubd80. \u2018\u2014\uac70\ub4e0\uc694\u2019\ub294 \uc774\uc720/\ubc30\uacbd\uc744 \ub354\ud558\ub294 \ud45c\ud604\uc785\ub2c8\ub2e4. \uc5ec\uae30\uc11c \uc800\ub97c \uc4f4 \uac83\uc740 \uc74c\ud0c5\uc774 \uc9c4\uc9c0\ud568\uc744 \uc2e0\ud638\ud569\ub2c8\ub2e4.',
      example: 'A: "\ub204\uad6c\uc138\uc694?" B: "\uc800 \uc774 \ud504\ub85c\uc81d\ud2b8 \ub2f4\ub2f9\uc790\uac70\ub4e0\uc694."',
      example_ko: 'A: "Who are you?" B: "I\u0027m the person in charge of this project, you see."',
      youtubeUrl: ''
    },
    {
      korean: '\ub098\ud55c\ud14c \ubcf4\uc774\ub294 \uac8c \uadf8\uac8c \ub2e4\uba74, \ub204\ub3c4 \ub3c4\uae68\ube44 \uc2e0\ubd80\uac00 \uc544\ub2c8\uc57c.',
      romanization: 'Nahante boineun ge geuge damyeon, neon dokkaebi sinbuga aniya.',
      english: 'If that\u2019s all you can see in me, you are not the Goblin\u2019s bride.',
      partOfSpeech: 'expression',
      scene: 'Script p.46 \u2014 S#50. Kim Shin challenges Eun-tak to prove her claim. She describes what she sees (tall, expensive clothes, mid-thirties) and he looks unimpressed. He says this: a test she doesn\t realise she is already passing.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 46\ud398\uc774\uc9c0 \u2014 S#50. \uae40\uc2e0\uc774 \uc740\ud0c1\uc5d0\uac8c \uc2e0\ubd80\uc784\uc744 \uc99d\uba85\ud558\ub77c\uace0 \ud569\ub2c8\ub2e4. \uadf8\ub140\uac00 \ub208\uc5d0 \ubcf4\uc774\ub294 \uac83\ub4e4\uc744 \ub9d0\ud558\uc790 \uac74\uc870\ud558\uac8c \uc774\ub807\uac8c \ub9d0\ud569\ub2c8\ub2e4.',
      meaning: '\u2018\u2014\uad70/\ub2e4\uba74 = if that\u2019s all / if that\u2019s the case. \uc2e0\ubd80\uac00 \uc544\ub2c8\ub2e4 = is not the bride. Conditional structure: \u201cif ~ then ~\u201d. This sets up a test \u2014 and crucially, what she can\u2019t see (the sword in his chest) is the real proof. Grammar and plot interlock.',
      meaning_ko: '\u2018\u2014\uc774\uba74\u2019 = \uc870\uac74(~\ud55c\ub2e4\uba74). \uc2e0\ubd80\uac00 \uc544\ub2c8\ub2e4 = \uc2e0\ubd80\uc5d0 \ud574\ub2f9\ud558\uc9c0 \uc54a\ub294\ub2e4. \uc870\uac74\ubb38 \uad6c\uc870\ub294 \ud55c\uad6d\uc5b4\uc5d0\uc11c \ub9e4\uc6b0 \ub9ce\uc774 \uc4f0\uc774\uba70, \ud50c\ub86f\uacfc \ubb38\ubc95\uc774 \ud568\uaed8 \uc6c0\uc9c1\uc774\ub294 \uc7a5\uba74\uc785\ub2c8\ub2e4.',

      english: 'I\u2019m going to marry you.',
      partOfSpeech: 'expression',
      scene: 'Script p.47 \u2014 S#51. Canada / Qu\u00e9bec. Kim Shin has accidentally teleported Eun-tak through a door. She spins around in shock and delight at the autumn leaves, the cobblestones, the foreign sky. She makes a decision. And says this. Calmly. The episode ends.',
      scene_ko: '\uc2a4\ud06c\ub9bd\ud2b5 47\ud398\uc774\uc9c0 \u2014 S#51. \ucf90\ub098\ub2e4/\ucfe0\ubca0. \uc740\ud0c1\uc774 \uc6b0\uc5f0\ud788 \ubb38\uc744 \ud1b5\ud574 \uce90\ub098\ub2e4\ub85c \uc624\uac8c \ub429\ub2c8\ub2e4. \ub2e8\ud48d\uc78e\uacfc \ub3cc\ubc14\ub2e5, \ub099\uc5fd\ud55c \ud558\ub298\uc744 \ubcf4\uba74\uc11c \uac00\ubcfc\uac8c \uacb0\uc2ec\ud558\uace0 \ub9d0\ud569\ub2c8\ub2e4. \uc5d0\ud53c\uc18c\ub4dc 1\ud654 \uc5d4\ub529.',

      example: 'A: "\uc800 \uc774 \uc77c \ub9e1\uac8c\uc694 \uc544\uc800\uc528\ud55c\ud14c." B: "\uc5b8\uc81c\ubd80\ud130 \uc6d0\ud588\uc5b4\uc694?"',

      scene_ko: '스크립트 26페이지 — S#31. 거리. 어린 덕화가 걸어가다 맞은편에서 오는 매력적인 여성을 발견합니다. 멈추고, 돌아보고, 딱 이 한 마디만 합니다. 그녀가 멈춥니다.',

      meaning: '이 = this, 아저씨 = middle-aged man (common address), 누군데? = who is it/who is he? (casual, slightly blunt). 누군데요? would be politer. The bluntness here is the child\'s honesty — not disrespect, just directness.',

      meaning_ko: '꽃말은 꽃의 상징적 의미입니다. 뭐예요?는 무엇이에요?의 구어체. 연인은 연인/애인. 꽃말은 한국에서 진지하게 여기는 문화로, 꽃말을 모르고 꽃을 선물하면 실수가 될 수 있습니다.',

      meaning: '맞아요? = is that right? 정말? = really? 진짜 = truly/for real. 대체 = exactly/on earth (used for emphasis in questions). 대체 뭐지? = what on earth am I? This triple-check reaction mirrors real surprised Korean speech perfectly.',
      meaning_ko: '맞아요?는 맞다의 의문형, 정말?은 정말인지 확인, 진짜는 강조 부사. 대체는 의문문에서 강조 역할. 세 단계로 쌓이는 이 반응은 실제 한국어 충격 반응을 잘 보여줍니다.',

      meaning: '아 = ah/oh (natural exclamation, softens the command). 잠깐만요 = just a moment, please. Together they sound urgent but not rude. The 아 prefix is very natural in spontaneous speech — it\'s the sound of reacting before words form. Very common in everyday Korean.',
      meaning_ko: '아는 자연스러운 감탄사로 명령을 부드럽게 만듭니다. 잠깐만요는 잠깐만+요입니다. 둘이 합치면 급하지만 무례하지 않은 표현이 됩니다. 즉흥적인 발화에서 아를 먼저 붙이는 것은 매우 자연스럽습니다.',

  var EP_NUM = 1;
  var TOTAL  = 30;

  function goHome() { window.location.href = '../../../index.html'; }

  /* Called by setLang() in app.js on every language switch */
  function applyPageLang() {
    buildExpressions();
  }

  function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var list = document.getElementById('exprList');
    if (!list) return;

    // Update UI text
    var secLbl = document.getElementById('expr-section-label');
    if (secLbl) secLbl.innerHTML = isKo
      ? '&#127472;&#127479; 한국어 표현 30개 &mdash; 도깨비 1화'
      : '&#127482;&#127480; 30 Korean Expressions &mdash; Guardian Episode 1';

    document.getElementById('nav-home').textContent  = isKo ? '홈' : 'Home';
    document.getElementById('nav-back').textContent  = isKo ? '도깨비로' : 'Back to Guardian';
    document.getElementById('bc-ep').textContent     = isKo ? '1화' : 'E1';
    document.getElementById('hdr-title').textContent = isKo ? '도깨비 — 1화' : 'Guardian — Episode 1';
    document.getElementById('hdr-meta').textContent  = isKo
      ? '한국어 표현 30개 · 쇼츠를 클릭해 장면에서 확인하세요'
      : '30 Korean Expressions · Click a Short to watch in context';
    document.getElementById('bm-ep-label').textContent = isKo ? '에피소드 저장' : 'Bookmark Episode';

    var dataExprs = EP_DATA.expressions || [];
    var html = '';

    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'guardian-e' + EP_NUM + 'x' + num;
      var bmUrl = 'dramas/guardian/episodes/ep' + EP_NUM + '.html#slot' + num;

      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.length > 10;
        var ytLabel = isKo
          ? (isLive ? '&#9654; 쇼츠 보기' : '&#9654; 쇼츠 준비중')
          : (isLive ? '&#9654; Watch Short' : '&#9654; Short Coming Soon');
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + escHtml(x.youtubeUrl) + '" target="_blank" rel="noopener">' + ytLabel + '</a>'
          : '<button class="btn-youtube pending">' + ytLabel + '</button>';

        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var sceneCtx = (isKo && x.scene_ko) ? x.scene_ko : (x.scene || '');
        var exprNumLabel = isKo ? ('표현 ' + num) : ('Expression ' + num);
        var bmLabel = isKo ? '&#128278; 저장' : '&#128278; Bookmark';

        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNumLabel + ' &middot; Guardian E' + EP_NUM + '</div>';
        html += '<div class="expr-korean">' + escHtml(x.korean) + '</div>';
        html += '<div class="expr-roman">' + escHtml(x.romanization) + '</div>';
        html += '<div class="expr-english">' + escHtml(x.english) + '</div>';
        if (sceneCtx) html += '<div class="expr-scene">&#128249; ' + escHtml(sceneCtx) + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + bmLabel + '</button>';
        html += '</div></div>';

      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">' + (isKo ? '표현 ' : 'Expression ') + num + '</div>';
        html += '<div class="expr-korean" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Coming soon.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">&#9654; Short Coming Soon</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">&#128278; Bookmark</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
    syncBookmarkButtons();
  }

  function handleExprBm(num) {
    toggleBookmark('expression', 'guardian-e'+EP_NUM+'x'+num,
      '&#128172; Guardian E'+EP_NUM+' #'+num,
      'dramas/guardian/episodes/ep'+EP_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    if (!hasAgreed()) {
      window.location.href = '../../../index.html?redirect=' + encodeURIComponent(window.location.href);
      return;
    }
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-family:\'Syne\',sans-serif;font-size:1.3rem;font-weight:800;color:var(--accent);margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:var(--muted);margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
    injectTermsModal();
    document.getElementById('topbar-lang-wrap').innerHTML = buildLangToggle();
    applyLang();
    buildExpressions();
    renderBookmarkBar();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });

</script>
