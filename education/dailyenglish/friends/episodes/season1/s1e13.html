<script>
  var EP_DATA = {
    available: true,
    title: 'The One with the Boobies',
    description: 'Accidental nakedness causes chaos. Joey\'s father has a mistress.',
    expressions: [
    {
      phrase: 'You just barge in here and you don\'t knock?',
      partOfSpeech: 'expression',
      meaning: '"Barge in" means to enter a place suddenly and without permission. "You don\'t knock" criticizes someone for skipping the polite step of knocking on a closed door. Turning the accusation into a question makes it sound like an angry challenge.',
      meaning_ko: '"Barge in"은 허락 없이 갑자기 어떤 곳에 들어가는 것을 뜻합니다. "You don\'t knock"은 닫힌 문을 노크하는 예의를 지키지 않는다고 나무라는 말입니다. 비난을 의문문으로 바꾸어 화난 항의처럼 들리게 합니다.',
      example: 'A: "Hey, I came to borrow your charger." B: "You just barge in here and you don\'t knock? Seriously?"',
      example_ko: 'A: "충전기 좀 빌리러 왔어." B: "그냥 막 들어와서 노크도 안 해? 진짜야?"',
      context: 'Chandler accidentally walks in while Rachel is changing. She turns on him right away, and this line starts the awkward argument that drives the episode.',
      context_ko: '레이철이 옷을 갈아입고 있을 때 찬들러가 실수로 들어옵니다. 그녀는 곧바로 그를 몰아붙이며, 이 말로 에피소드를 이끄는 어색한 말다툼이 시작됩니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X1'
    },
    {
      phrase: 'Didn\'t you get a good enough look the other day?',
      partOfSpeech: 'expression',
      meaning: 'A sarcastic question meaning "You already looked at me enough, so stop staring." "Get a good look" means to see something clearly and fully. "The other day" refers back to the earlier accident.',
      meaning_ko: '"이미 충분히 쳐다봤잖아, 그러니 그만 좀 봐"라는 뜻의 빈정대는 질문입니다. "Get a good look"은 무언가를 분명하고 충분히 보는 것을 뜻합니다. "the other day"는 앞서 일어난 사고를 가리킵니다.',
      example: 'A: "Why are you staring at my new shoes?" B: "Didn\'t you get a good enough look yesterday? They\'re the same shoes!"',
      example_ko: 'A: "왜 내 새 신발을 계속 쳐다봐?" B: "어제 충분히 봤잖아? 같은 신발이잖아!"',
      context: 'Rachel accuses Chandler of staring at her, and he pretends not to know what she means. She answers with this sarcastic reminder of the accidental look.',
      context_ko: '레이철은 찬들러가 자신을 계속 쳐다본다고 비난하고, 찬들러는 무슨 말인지 모르는 척합니다. 그녀는 우연히 본 일을 상기시키며 이 빈정대는 질문으로 받아칩니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X2'
    },
    {
      phrase: 'How long has Chandler been in the shower?',
      partOfSpeech: 'expression',
      meaning: 'A question asking how long an activity has been going on up to now. "Has been + -ing" (present perfect continuous) describes an action that started in the past and is still continuing.',
      meaning_ko: '지금까지 어떤 활동이 얼마나 오래 계속되었는지 묻는 질문입니다. "has been + -ing"(현재완료 진행형)는 과거에 시작되어 지금도 계속되는 동작을 나타냅니다.',
      example: 'A: "How long has Dad been on the phone?" B: "About an hour. He still hasn\'t hung up."',
      example_ko: 'A: "아빠 통화 얼마나 오래 하고 계셔?" B: "한 시간쯤. 아직도 안 끊으셨어."',
      context: 'Rachel asks Monica this while planning her revenge. When Monica says about five minutes, Rachel answers "Perfect."',
      context_ko: '레이철이 복수를 준비하면서 모니카에게 이렇게 묻습니다. 모니카가 약 5분이라고 답하자 레이철은 "완벽해"라고 말합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X3'
    },
    {
      phrase: 'You\'re not him, you\'re you.',
      partOfSpeech: 'expression',
      meaning: 'A reassuring statement meaning "You are not the same as your father. You have your own identity and choices." It contrasts "him" and "you" to separate a person from the person they fear becoming.',
      meaning_ko: '"당신은 그 사람이 아니라 당신 자신이다"라는 뜻의 위로의 말입니다. "him"과 "you"를 대비시켜, 상대가 되기 두려워하는 사람과 그 사람을 분리합니다.',
      example: 'A: "I\'m scared I\'ll end up like my dad." B: "You\'re not him, you\'re you. Your choices are yours."',
      example_ko: 'A: "아빠처럼 될까 봐 무서워." B: "너는 그 사람이 아니라 너야. 선택은 네 몫이야."',
      context: 'Joey worries he might be unfaithful like his father. Chandler cuts to the heart of that fear with simple, sincere comfort, one of the few times he speaks without a joke.',
      context_ko: '조이는 아버지처럼 바람을 피울까 봐 걱정합니다. 찬들러는 이 간단하고 진심 어린 말로 두려움의 핵심을 짚는데, 농담 없이 진지하게 위로하는 드문 순간입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X4'
    },
    {
      phrase: 'Okay, except I broke up with Roger.',
      partOfSpeech: 'expression',
      meaning: 'A casual way to answer "How\'s it going?" while dropping a surprising piece of news. "Except" introduces a qualification, and "broke up with" means ended a romantic relationship.',
      meaning_ko: '"How\'s it going?"에 놀라운 소식을 덧붙여 가볍게 답하는 방식입니다. "except"는 "~만 빼고"라는 단서를 붙이며, "broke up with"는 연애 관계를 끝냈다는 뜻입니다.',
      example: 'A: "How was your weekend?" B: "Okay, except I broke up with my boyfriend on Friday."',
      example_ko: 'A: "주말 어땠어?" B: "괜찮았어, 근데 금요일에 남자친구랑 헤어졌어."',
      context: 'Phoebe arrives at Monica\'s place, and when her friends ask how she is doing, she says she is okay, except that she has just broken up with Roger.',
      context_ko: '피비가 모니카의 집에 도착해 친구들이 어떠냐고 묻자, 괜찮다면서도 로저와 헤어졌다고 알립니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X5'
    },
    {
      phrase: 'I don\'t feel guilty for her failures.',
      partOfSpeech: 'expression',
      meaning: '"Feel guilty for" means to feel responsible for something bad that someone else did. Saying you do not feel guilty for someone\'s failures is a firm rejection of blame.',
      meaning_ko: '"Feel guilty for"는 다른 사람이 저지른 나쁜 일에 대해 자기 책임이라고 느끼는 것을 뜻합니다. 누군가의 실패에 죄책감을 느끼지 않는다고 말하는 것은 책임을 단호하게 거부하는 말입니다.',
      example: 'A: "Your brother says the mess at work is partly your fault." B: "That\'s ridiculous. I don\'t feel guilty for his failures."',
      example_ko: 'A: "네 동생이 회사 문제는 네 탓도 있대." B: "말도 안 돼. 걔 실패에 대해 난 죄책감 안 느껴."',
      context: 'Monica suggests Ross wrecked his marriage so that she would look less like a failure to their parents. Ross calls the idea ridiculous and refuses to take the blame.',
      context_ko: '모니카는 로스가 부모님 눈에 자신이 덜 실패한 것처럼 보이도록 결혼 생활을 망쳤을 수도 있다고 말합니다. 로스는 말도 안 된다며 그 책임을 받아들이지 않습니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X6'
    },
    {
      phrase: 'After a certain point, you gotta let go.',
      partOfSpeech: 'expression',
      meaning: '"After a certain point" means once a certain stage or amount of time has passed. "Let go" means to stop trying to control something and accept it. "Gotta" is the casual form of "have to."',
      meaning_ko: '"After a certain point"는 어느 단계나 시점이 지난 뒤를 뜻합니다. "Let go"는 무언가를 통제하려는 것을 멈추고 받아들인다는 뜻입니다. "Gotta"는 "have to"의 구어체입니다.',
      example: 'A: "I keep trying to fix his mistakes." B: "After a certain point, you gotta let go. He has to learn on his own."',
      example_ko: 'A: "계속 그 사람 실수를 고쳐 주려고 해." B: "어느 정도가 지나면 놔야 해. 그 사람도 스스로 배워야 해."',
      context: 'Joey concludes that he cannot control his parents\' choices forever. He accepts that they have to make their own mistakes, even when he knows better.',
      context_ko: '조이는 부모님의 선택을 영원히 통제할 수는 없다고 결론짓습니다. 자신이 더 잘 안다고 해도, 부모님이 스스로 실수를 겪어야 한다는 것을 받아들입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X7'
    },
    {
      phrase: 'There\'s only one way to resolve this.',
      partOfSpeech: 'expression',
      meaning: '"Resolve" means to settle or fix a problem. "There\'s only one way to" introduces a single proposed solution, often one that is absurd or strongly argued. The confident tone is what makes it funny.',
      meaning_ko: '"Resolve"는 문제를 해결하거나 정리한다는 뜻입니다. "There\'s only one way to"는 단 하나의 해결책을 제시할 때 씁니다. 확신에 찬 어조 때문에 더 웃깁니다.',
      example: 'A: "We keep arguing about who forgot the reservation." B: "There\'s only one way to resolve this. We both pay for dinner."',
      example_ko: 'A: "예약을 누가 잊었는지로 계속 싸우고 있어." B: "이걸 해결할 방법은 하나뿐이야. 둘이 저녁값 같이 내자."',
      context: 'Chandler saw Rachel\'s breasts by accident, and Ross proposes an absurd fix: since Chandler saw hers, he has to show her his in return.',
      context_ko: '찬들러가 실수로 레이철의 가슴을 봤는데, 로스가 황당한 해결책을 내놓습니다. 찬들러가 그녀의 것을 봤으니 그에 대한 대가로 자기 것을 보여줘야 한다는 것입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X8'
    },
    {
      phrase: 'Fasten your seat belts. It\'s pee-pee time.',
      partOfSpeech: 'expression',
      meaning: '"Fasten your seat belts" is a standard airplane safety instruction, here used as a dramatic warning before something silly. "Pee-pee" is a childish word for male genitals. The serious warning paired with a silly word creates the humor.',
      meaning_ko: '"Fasten your seat belts"는 비행기에서 하는 표준 안내 문구인데, 여기서는 우스운 일이 벌어지기 전에 하는 극적인 경고로 쓰입니다. "Pee-pee"는 남성 성기를 가리키는 유아적인 표현이며, 진지한 경고와 유치한 단어의 조합이 웃음을 만듭니다.',
      example: 'A: "The kids are finally awake." B: "Fasten your seat belts. It\'s breakfast time!"',
      example_ko: 'A: "아이들이 드디어 일어났어." B: "안전벨트 매. 아침 먹을 시간이야!"',
      context: 'After confirming Chandler is in the shower, Rachel announces her revenge plan to Monica in dramatic, airplane-style language before heading to the boys\' apartment.',
      context_ko: '찬들러가 샤워 중인 것을 확인한 뒤, 레이철은 비행기 안내 방송 같은 과장된 말투로 모니카에게 복수 계획을 알린 다음 남자들의 아파트로 향합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X9'
    },
    {
      phrase: 'That wasn\'t easy, but you did it.',
      partOfSpeech: 'expression',
      meaning: 'A reminder that someone overcame a hard challenge before, used to encourage them. "That wasn\'t easy" admits the difficulty, and "but you did it" points out that the person succeeded anyway.',
      meaning_ko: '사람이 과거에 힘든 도전을 이겨냈다는 것을 상기시켜 격려하는 말입니다. "That wasn\'t easy"는 어려움을 인정하고, "but you did it"은 그럼에도 해냈다는 점을 짚습니다.',
      example: 'A: "I don\'t think I can finish this marathon." B: "Training all winter wasn\'t easy, but you did it."',
      example_ko: 'A: "이 마라톤 끝까지 못 뛸 것 같아." B: "겨울 내내 훈련하는 건 쉽지 않았지만 너는 해냈잖아."',
      context: 'Chandler reminds Joey that he once turned down his father\'s business to become an actor, a hard and unpopular choice. He uses this to argue that Joey can stay faithful when it matters.',
      context_ko: '찬들러는 조이가 한때 아버지의 사업을 거절하고 배우의 길을 택했던, 힘들고 인기 없던 결정을 상기시킵니다. 그는 이를 근거로 중요한 순간에 조이가 충실할 수 있다고 주장합니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X10'
    },
    {
      phrase: 'It\'s just, I hate that guy.',
      partOfSpeech: 'expression',
      meaning: '"It\'s just" softens what comes next and signals a personal confession. "I hate that guy" is a blunt, direct statement of strong dislike. Together they show someone admitting the honest truth after a long list of praise.',
      meaning_ko: '"It\'s just"는 뒤에 오는 말을 부드럽게 시작하며 개인적인 고백임을 알립니다. "I hate that guy"는 강한 싫음을 직설적으로 드러내는 말입니다. 함께 쓰여, 긴 칭찬 끝에 솔직한 속마음을 털어놓는 모습을 보여 줍니다.',
      example: 'A: "So what do you think of the new manager?" B: "He\'s smart and fair. It\'s just, I hate that guy."',
      example_ko: 'A: "새 매니저 어떻게 생각해?" B: "똑똑하고 공정하긴 한데, 그냥 저 사람이 싫어."',
      context: 'Phoebe lists Roger\'s good qualities before revealing the real problem: she hates him. The contrast between her long praise and this blunt ending is classic Phoebe.',
      context_ko: '피비는 로저의 장점을 길게 늘어놓은 뒤 진짜 문제를 털어놓습니다. 긴 칭찬과 직설적인 결론의 대비가 피비다운 모습입니다.',
      youtubeUrl: 'https://www.youtube.com/watch?v=REPLACE_S1E13X11'
    },
    {
      phrase: 'Hey, I married a lesbian to make you look good.',
      partOfSpeech: 'expression',
      meaning: 'A deliberately absurd, self-deprecating argument used to win a sibling fight. "To make you look good" means that his own failure supposedly benefited someone else. The silliness of the claim is what makes it funny.',
      meaning_ko: '남매 싸움에서 이기기 위해 일부러 터무니없게 자신을 깎아내리며 펼치는 주장입니다. "To make you look good"은 자신의 실패가 다른 사람에게 도움이 되었다는 뜻입니다. 주장이 황당하기 때문에 웃음이 납니다.',
      example: 'A: "You always get the better deal." B: "Oh yeah? I broke the window to make you look good."',
      example_ko: 'A: "넌 항상 더 좋은 대우를 받잖아." B: "그래? 난 네가 돋보이라고 창문을 깼어."',
      context: 'Monica accuses Ross of sucking up to their parents so they would favor him. Ross fires back with this absurd claim, saying his failed marriage was really a favor to Monica.',

  var S_NUM = 1;
  var E_NUM = 13;
  var TOTAL = 15;

  function goHome() { window.location.href = '../../../index.html'; }

  function buildExpressions() {
    var isKo = getLang() === 'ko';
    var dataExprs = EP_DATA.expressions || [];
    var list = document.getElementById('exprList');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var x   = (i < dataExprs.length) ? dataExprs[i] : null;
      var num = i + 1;
      var bmId  = 'expr-s' + S_NUM + 'e' + E_NUM + 'x' + num;
      var bmUrl = 'friends/episodes/season' + S_NUM + '/s' + S_NUM + 'e' + E_NUM + '.html#slot' + num;
      if (x) {
        var isLive = x.youtubeUrl && x.youtubeUrl.indexOf('REPLACE') === -1 && x.youtubeUrl.length > 25;
        var ytBtn = isLive
          ? '<a class="btn-youtube" href="' + x.youtubeUrl + '" target="_blank" rel="noopener">' + t('expr.watch') + '</a>'
          : '<button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        var pos = x.partOfSpeech
          ? '<span style="font-size:0.7rem;color:var(--accent3);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:1px">' + escHtml(x.partOfSpeech) + '</span>'
          : '';
        var meaning = (isKo && x.meaning_ko) ? x.meaning_ko : x.meaning;
        var example = (isKo && x.example_ko) ? x.example_ko : x.example;
        var context = (isKo && x.context_ko) ? x.context_ko : x.context;
        var exprNum = isKo
          ? ('표현 ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM)
          : ('Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM);
        html += '<div class="expr-card" id="slot' + num + '">';
        html += '<div class="expr-num">' + exprNum + '</div>';
        html += '<div class="expr-phrase">&ldquo;' + escHtml(x.phrase) + '&rdquo;' + pos + '</div>';
        html += '<div class="expr-meaning">' + escHtml(meaning) + '</div>';
        html += '<div class="expr-example">' + escHtml(example) + '</div>';
        if (context) html += '<div class="expr-context">&#128205; ' + escHtml(context) + '</div>';
        html += '<div class="expr-actions">' + ytBtn;
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      } else {
        html += '<div class="expr-card placeholder-slot" id="slot' + num + '">';
        html += '<div class="expr-num">Expression ' + num + ' &middot; S' + S_NUM + 'E' + E_NUM + '</div>';
        html += '<div class="expr-phrase" style="color:var(--muted)">&#128172; Expression ' + num + '</div>';
        html += '<div class="expr-meaning" style="color:var(--muted)">Add this expression to EP_DATA.expressions in the page source.</div>';
        html += '<div class="expr-actions"><button class="btn-youtube pending">' + t('expr.coming') + '</button>';
        html += '<button class="btn-bm" data-bm-id="' + bmId + '" onclick="handleExprBm(' + num + ')">' + t('bm.bookmark') + '</button>';
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
  }

  function handleExprBm(num) {
    toggleBookmark('expression','expr-s'+S_NUM+'e'+E_NUM+'x'+num,'💬 S'+S_NUM+'E'+E_NUM+' Expr'+num,'friends/episodes/season'+S_NUM+'/s'+S_NUM+'e'+E_NUM+'.html#slot'+num);
  }

  window.addEventListener('DOMContentLoaded', function() {
    /* ── Availability guard ── */
    if (!EP_DATA.available) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d1b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;';
      overlay.innerHTML =
        '<div style="font-size:3rem;margin-bottom:1rem;">&#128274;</div>'
        + '<div style="font-size:1.3rem;font-weight:900;color:#38bdf8;margin-bottom:0.5rem;">Coming Soon</div>'
        + '<div style="font-size:0.9rem;color:#6b87aa;margin-bottom:2rem;">This episode is not available yet.<br>Check back soon!</div>'
        + '<button onclick="history.back()" style="background:#38bdf8;color:#0d1b2e;border:none;border-radius:10px;padding:10px 28px;font-size:0.95rem;font-weight:800;cursor:pointer;">&#9664; Go Back</button>';
      document.body.appendChild(overlay);
      return;
    }
    checkTermsGuard();
    buildExpressions();
    if (window.location.hash) {
      setTimeout(function() {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  });
</script>
